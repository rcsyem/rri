[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rri-recon-intelligence"
version = "0.1.0"
description = "RRI - Recon Intelligence CLI"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.12,<4"
]

[project.scripts]
rri = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "modules*"]
